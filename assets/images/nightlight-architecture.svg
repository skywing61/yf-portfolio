<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">透明感夜燈系統架構示意</title>
  <desc id="desc">T113 平台整合 SPI＋RGB 面板及感測器，搭配圓柱透明顯示結構。</desc>
  <rect width="1600" height="1000" fill="#f4f6f5"/>
  <g font-family="Microsoft JhengHei, sans-serif" text-anchor="middle">
    <text x="800" y="140" font-size="56" fill="#5e6864">系統架構示意</text>
    <rect x="400" y="215" width="800" height="210" rx="28" fill="#286557"/>
    <text x="800" y="305" font-size="80" font-weight="700" fill="#fff">T113</text>
    <text x="800" y="365" font-size="56" fill="#fff">顯示與感測整合</text>
    <path d="M800 425v90H440v65M800 515h360v65" fill="none" stroke="#aab7b0" stroke-width="4"/>
    <g fill="#fff" stroke="#d9dfdb" stroke-width="2">
      <rect x="160" y="580" width="560" height="215" rx="28"/>
      <rect x="880" y="580" width="560" height="215" rx="28"/>
    </g>
    <g fill="#202725" font-size="64" font-weight="700">
      <text x="440" y="670">SPI＋RGB 面板</text><text x="1160" y="670">感測器</text>
    </g>
    <g fill="#5e6864" font-size="56">
      <text x="440" y="735">角色影像呈現</text><text x="1160" y="735">感測整合</text>
      <text x="800" y="900">搭配圓柱透明顯示結構</text>
    </g>
  </g>
</svg>
